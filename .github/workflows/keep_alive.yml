name: Keep Alive Render Backend

on:
  schedule:
    # Runs every 10 minutes (Render free tier shuts down after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          # Set BACKEND_URL as a GitHub Repository Secret, or fall back to hardcoded URL.
          BACKEND_URL="${{ secrets.BACKEND_URL || 'https://insightx-m0fs.onrender.com' }}"
          echo "Pinging backend at: $BACKEND_URL/api/health"
          curl -f -s -m 30 "$BACKEND_URL/api/health" || echo "Warning: Ping failed or timed out."
