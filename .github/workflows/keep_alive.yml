name: Keep Alive Render Backend

on:
  schedule:
    # Runs every 14 minutes (Render shuts down after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          # Make sure to replace this URL with your actual deployed Render backend URL,
          # or set it as a GitHub Repository Secret named BACKEND_URL.
          BACKEND_URL="${{ secrets.BACKEND_URL || 'https://insightx-backend.onrender.com' }}"
          echo "Pinging backend at: $BACKEND_URL/api/health"
          curl -f -s -m 15 "$BACKEND_URL/api/health" || echo "Warning: Ping failed or timed out."
